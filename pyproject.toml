[project]
name = "okonomi"
version = "0.1.0"
description = "A terminal agent for creative tasks; a learning project on harness design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Nair", email = "dhruv@huggingface.co" }]
keywords = ["ai", "image-generation", "creative-ai", "flux", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.28.1",
  "mcp[cli]>=1.12.2",
  "prompt-toolkit>=3.0.43",
  "pydantic-ai>=2.27.0",
  "anthropic>=0.121.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "rich>=14.0.0",
  "ddgs>=9.0.0",
  "lxml>=5.0.0",
]

[project.scripts]
okonomi = "okonomi.cli:main"

[dependency-groups]
debug = [
    "ipdb>=0.13.13",
]
dev = ["ipdb>=0.13.13", "pyright>=1.1.403", "pytest>=8", "ruff>=0.12.5"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okonomi"]

[tool.hatch.build]
include = [
  "okonomi/**/*.py",
  "okonomi/**/*.md",
  "okonomi/**/*.yml",
  "config.json",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["okonomi"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
